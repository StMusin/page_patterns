name: UI tests

permissions:
  contents: write

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 3.14 лучше не использовать в CI
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          playwright install --with-deps

      - name: Run tests
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  publish-report:
    if: always()
    needs: [ run-tests ]
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем текущий сайт (gh-pages) — это источник history
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      # 2. Скачиваем результаты тестов
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # 3. Генерация отчёта с УЧЁТОМ старого сайта
      - name: Generate Allure report with history
        uses: andgineer/allure-report@v3
        with:
          allure-results: allure-results

          # КРИТИЧНО: передаём старый сайт
          website: gh-pages

          # куда генерить новый сайт
          reports-site: gh-pages-dir
          reports-site-path: builds/tests

          # ссылка на сайт (нужно для корректных трендов)
          website-url: https://stmusin.github.io/page_patterns

          max-reports: 20

      # 4. Проверка
      - name: Debug generated site
        run: |
          echo "=== gh-pages-dir ==="
          ls -R gh-pages-dir || true

      # 5. Деплой
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages-dir
          force_orphan: true